# Marathon SearXNG settings.
# Hardened for local agent use:
#   - JSON format enabled (required by the router)
#   - Public-facing features disabled (this instance is bound to 127.0.0.1)
#   - Rate limiter off (single-user local instance; trust boundary is the loopback bind)
#
# To customise per-host, edit this file or add your own docker compose override.

use_default_settings:
  engines:
    # SearXNG otherwise merges every upstream default into this file.
    # Keep the small set that is useful and currently reliable for local agents.
    keep_only:
      - bing
      - google cse
      - wikipedia

general:
  debug: false
  instance_name: "Marathon SearXNG"
  contact_url: false
  donation_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

server:
  base_url: false
  limiter: false
  public_instance: false
  image_proxy: false
  http_protocol_version: "1.1"
  method: "GET"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

ui:
  static_use_hash: true
  default_locale: "en"
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  cache_url: ""
  default_theme: simple
  theme_args:
    simple_style: auto

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  retries: 1

# Google CSE currently provides the best technical/documentation results without
# requiring a user API key. Bing provides an independent fallback, and Wikipedia
# improves entity searches. Avoid the CAPTCHA-prone HTML scrapers that make local
# agent searches intermittently fail.
engines:
  - name: google cse
    disabled: false
    weight: 2.0
  - name: bing
    disabled: false
  - name: wikipedia
    disabled: false
