[[families.profiles]]
id = "dflash-256k"
display_name = "DFlash2 256K"
description = "Q4_K_M target with the DFlash2 block drafter for lossless speculative decoding on GPUs 2 and 3. Uses the pinned dFlash2 backend because the current upstream build predates the merged drafter tensor layout."
