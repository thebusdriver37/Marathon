[settings]
ai_root = "~/AI"
model_root = "models/gguf"
llama_host = "127.0.0.1"
llama_port = 8082
router_host = "127.0.0.1"
router_port = 18111
health_timeout = 360
stop_timeout = 20
prompt_cache_ram_mib = 8192
slot_snapshots_enabled = true
slot_snapshot_max_count = 8
slot_snapshot_max_bytes = 34359738368
slot_snapshot_ttl_seconds = 172800
slot_snapshot_idle_seconds = 60
slot_snapshot_min_tokens = 16384
slot_snapshot_min_token_growth = 4096
slot_snapshot_clean_startup = false

[[backends]]
id = "upstream"
display_name = "Current upstream llama.cpp (Ampere CUDA build)"
server = "backends/llama.cpp-current/build/bin/llama-server"

[[backends]]
id = "deepseek-v4"
display_name = "DeepSeek V4 llama.cpp fork"
server = "backends/llama.cpp-deepseek-v4/build/bin/llama-server"

[[backends]]
id = "deepseek-v4-longctx"
display_name = "DeepSeek V4 optimized long-context llama.cpp"
server = "backends/llama.cpp-ds4-longctx/build-cuda/bin/llama-server"
environment = { DSV4_CONSTANT_SHAPE = "1", DSV4_IDX_SKIP = "1", DSV4_MOE_TILE = "1", DSV4_SPARSE_FA = "1" }

[[backends]]
id = "deepseek-v4-longctx-mtp"
display_name = "DeepSeek V4 optimized long-context llama.cpp + MTP"
server = "backends/llama.cpp-ds4-longctx/build-cuda/bin/llama-server"
environment = { DSV4_CONSTANT_SHAPE = "1", DSV4_IDX_SKIP = "1", DSV4_MOE_TILE = "1", DSV4_SPARSE_FA = "1", DSV4_MTP_SPEC = "1", DSV4_MTP_DEV = "CUDA3", DSV4_MTP_EMBD_DEV = "CUDA3", DSV4_MTP_GGUF = "{model_dir}/DeepSeek-V4-Flash-MTP-Q4K-Q8_0-F32.gguf" }

[[backends]]
id = "ds4-distributed"
display_name = "DwarfStar DS4 four-GPU pipeline"
kind = "ds4_distributed"
server = "backends/ds4-tp/ds4-server"
worker = "backends/ds4-tp/ds4"
model_alias = "deepseek-v4-flash"
# The final worker returns its hidden state; the faster coordinator GPU runs
# the output head. This is output-identical and avoids a duplicate head copy
# on GPU 3.
layer_slices = ["0:9", "10:20", "21:31", "32:42"]
gpu_ids = [0, 1, 2, 3]
supports_slots = false
environment = { DS4_METAL_PREFILL_CHUNK = "1024", DS4_CUDA_NO_Q8_F16_CACHE = "1", DS4_CUDA_WEIGHT_PRELOAD_SPAN_MB = "256", DS4_CUDA_WEIGHT_ARENA_CHUNK_MB = "256" }

[[families]]
id = "deepseek-v4-flash"
display_name = "DeepSeek V4 Flash"
patterns = ["deepseek-v4-flash", "deepseek_v4_flash"]
backend = "ds4-distributed"
default_profile = "long-64k"

[[families.profiles]]
id = "safe"
display_name = "Safe 8K"
description = "Low-context DS4 four-GPU profile for direct chat."
context = 8192
batch = 512
ubatch = 128
parallel = 1
gpu_layers = "auto"
split_mode = "layer"
cache_k = "f16"
cache_v = "f16"
flash_attention = "off"
extra_args = ["--dist-prefill-chunk", "512", "--dist-prefill-window", "4"]
confidence = "benchmarked"
frontends = ["direct"]

[[families.profiles]]
id = "long-64k"
display_name = "Stable 64K"
description = "Optimized four-GPU profile without experimental speculative decoding."
context = 65536
batch = 4096
ubatch = 512
parallel = 1
gpu_layers = "999"
split_mode = "layer"
tensor_split = "1,1,0.95,0.9"
cache_k = "f16"
cache_v = "f16"
flash_attention = "on"
extra_args = ["--no-repack", "--fit", "off", "--reasoning", "on", "--reasoning-format", "deepseek", "--reasoning-budget", "2048"]
confidence = "verified"
frontends = ["codex", "hermes", "direct"]
backend = "deepseek-v4-longctx"
temperature = 0.0

[[families.profiles]]
id = "experimental-mtp-64k"
display_name = "Experimental MTP 64K"
description = "Faster speculative decoding with corrected sparse prompt attention."
context = 65536
batch = 4096
ubatch = 512
parallel = 1
gpu_layers = "999"
split_mode = "layer"
tensor_split = "1,1,0.95,0.9"
cache_k = "f16"
cache_v = "f16"
flash_attention = "on"
extra_args = ["--no-repack", "--fit", "off", "--spec-type", "dsv4-mtp", "--reasoning", "on", "--reasoning-format", "deepseek", "--reasoning-budget", "2048"]
confidence = "experimental"
frontends = ["codex", "hermes", "direct"]
backend = "deepseek-v4-longctx-mtp"
temperature = 0.0

[[families.profiles]]
id = "experimental-mtp-128k"
display_name = "MTP 128K"
description = "Verified 128K window using the fork's documented four-3090 MTP layout."
context = 131072
batch = 4096
ubatch = 512
parallel = 1
gpu_layers = "999"
split_mode = "layer"
tensor_split = "1,1,1,0.85"
cache_k = "f16"
cache_v = "f16"
flash_attention = "on"
extra_args = ["--no-repack", "--fit", "off", "--spec-type", "dsv4-mtp", "--reasoning", "on", "--reasoning-format", "deepseek", "--reasoning-budget", "2048"]
confidence = "verified"
frontends = ["codex", "hermes", "direct"]
backend = "deepseek-v4-longctx-mtp"
temperature = 0.0

